<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a2023" />
    <meta name="description" content="Reanty real estate homepage" />
    <title>Reanty — Real Estate</title>
    <script>
      try {
        const saved = localStorage.getItem('reanty-theme');
        const prefersDark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (prefersDark && !/\/admin\/?$/.test(location.pathname)) document.documentElement.classList.add('dark');
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
