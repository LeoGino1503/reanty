<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a2023" />
    <title>Log In | Reanty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../src/styles.css" />
    <link rel="stylesheet" href="../src/interactions.css" />
  </head>
  <body>
    <main class="login-page">
      <form class="login-popup" action="./coming-soon.html" method="get" aria-label="Log in">
        <a class="brand" href="./index.html"><img class="brand-logo" src="../public/logo.png" alt="Reanty." width="198" height="70" /></a>
        <nav class="login-switch" aria-label="Account"><a href="./login.html" class="active" aria-current="page">Log In</a><span aria-hidden="true">|</span><a href="./signup.html">Sign Up</a></nav>
        <label>Username or Email<input type="text" autocomplete="username" placeholder="Enter your username or email" required /></label>
        <label>Password<input type="password" autocomplete="current-password" placeholder="Enter your password" required /></label>
        <a class="login-forgot" href="./coming-soon.html">Forgot password?</a>
        <button class="btn btn-primary login-submit" type="submit">Log In</button>
      </form>
    </main>
  </body>
</html>
