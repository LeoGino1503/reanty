<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a2023" />
    <title>Coming soon | Reanty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="../src/styles.css" />
    <link rel="stylesheet" href="../src/interactions.css" />
  </head>
  <body>
    <main class="coming-soon">
      <div class="container coming-soon-grid">
        <div class="coming-soon-copy">
          <a class="brand" href="./index.html"><img class="brand-logo" src="../public/logo.png" alt="Reanty." width="198" height="70" /></a>
          <span class="eyebrow">Coming soon</span>
          <h1>This feature is on the way</h1>
          <p>We're still building this part of Reanty. Leave your email and we'll let you know as soon as it's ready.</p>
          <a class="btn btn-outline" href="./index.html">Back to home</a>
        </div>
        <form class="contact-form" action="../api/contact" method="post">
          <input type="hidden" name="return_to" value="contact-form" />
          <h3>Contact Us</h3>
          <label>Name<input name="name" type="text" placeholder="Enter your name" required minlength="2" /></label>
          <label>Email<input name="email" type="email" placeholder="Enter your email" required /></label>
          <label>Message<textarea name="message" placeholder="Enter your message" required minlength="5"></textarea></label>
          <button class="btn btn-primary" type="submit">Send</button>
          <p class="form-status" role="status"><span id="contact-form-done" class="form-flash">Message sent successfully.</span><span id="contact-form-error" class="form-flash">Please check your name, email and message.</span></p>
        </form>
      </div>
    </main>
  </body>
</html>
