<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a2023" />
    <title>Sign Up | Reanty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="./src/styles.css" />
    <link rel="stylesheet" href="./src/interactions.css" />
  </head>
  <body>
    <main class="login-page">
      <form class="login-popup is-signup" action="./coming-soon.html" method="get" aria-label="Sign up">
        <a class="brand" href="./index.html"><img class="brand-logo" src="./public/logo.png" alt="Reanty." width="198" height="70" /></a>
        <nav class="login-switch" aria-label="Account"><a href="./login.html">Log In</a><span aria-hidden="true">|</span><a href="./signup.html" class="active" aria-current="page">Sign Up</a></nav>
        <label>Username<input type="text" autocomplete="username" placeholder="Choose a username" required /></label>
        <label>Email<input type="email" autocomplete="email" placeholder="Enter your email" required /></label>
        <label>Password<input type="password" autocomplete="new-password" placeholder="Create a password" required /></label>
        <button class="btn btn-primary login-submit" type="submit">Sign Up</button>
      </form>
    </main>
  </body>
</html>
